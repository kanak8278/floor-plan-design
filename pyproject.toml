[project]
name = "fpeval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "numpy>=1.24", "ortools>=9.8",
                "anthropic>=0.40",
                # Rasterises the plan SVG so the agent can be shown the
                # drawing rather than a description of it. Chosen over
                # cairosvg because cairo needs a system library that is
                # not present here, and over playwright because a browser
                # is a lot of machinery for one PNG.
                "resvg-py>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpeval"]

[tool.pytest.ini_options]
# `tests/` holds pytest tests only; runnable CLI tools live in `scripts/`.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "api: hits the Anthropic API and costs money; deselect with -m 'not api'",
  "slow: takes more than ~30s (CP-SAT sweeps, full-corpus runs)",
  "corpus: needs data/ResPlan.pkl (246 MB, gitignored)",
]
